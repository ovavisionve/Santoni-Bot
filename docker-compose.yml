services:
  # ---- PostgreSQL (SantoniBot internal DB) ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-santonibot}
      POSTGRES_USER: ${POSTGRES_USER:-santonibot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-santonibot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- ChromaDB (Vector Database) ----
  chromadb:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    environment:
      ANONYMIZED_TELEMETRY: "false"

  # ---- Backend (FastAPI) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---- Frontend (Next.js) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---- Nginx (Reverse Proxy) ----
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/letsencrypt
      - nginx_logs:/var/log/nginx
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

  # ---- Certbot (SSL certificates - run manually) ----
  # Usage:
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
  #   docker compose run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    profiles: ["ssl"]
    volumes:
      - nginx_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

  # ---- Daily Sync (iDempiere → local, runs at midnight) ----
  # Manual: docker compose run --rm daily-sync
  # Cron:   0 0 * * * cd /opt/santonibot && docker compose run --rm daily-sync >> /opt/santonibot/logs/daily_sync.log 2>&1
  daily-sync:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["sync"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    entrypoint: ["python", "scripts/daily_sync.py"]

  # ---- Backup (PostgreSQL daily backup) ----
  # Manual: docker compose run --rm backup
  # Cron:   0 2 * * * cd /opt/santonibot && docker compose run --rm backup
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-santonibot}
      POSTGRES_USER: ${POSTGRES_USER:-santonibot}
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c '
        TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
        echo "[$$TIMESTAMP] Iniciando backup..."
        pg_dump -h $$POSTGRES_HOST -p $$POSTGRES_PORT -U $$POSTGRES_USER -d $$POSTGRES_DB --no-owner --no-privileges | gzip > /backups/santonibot_$$TIMESTAMP.sql.gz
        SIZE=$$(du -h /backups/santonibot_$$TIMESTAMP.sql.gz | cut -f1)
        echo "[$$TIMESTAMP] Backup completado: santonibot_$$TIMESTAMP.sql.gz ($$SIZE)"
        find /backups -name "santonibot_*.sql.gz" -mtime +30 -delete
        echo "Backups disponibles: $$(ls /backups/santonibot_*.sql.gz 2>/dev/null | wc -l)"
      '

volumes:
  postgres_data:
  chroma_data:
  nginx_certs:
  nginx_logs:
  certbot_webroot:
  db_backups:
