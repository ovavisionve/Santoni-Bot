# ═══════════════════════════════════════════════════════════════════════════
# Golden tests — SantoniBot vs iDempiere
# ═══════════════════════════════════════════════════════════════════════════
#
# Cada caso envía una pregunta al bot por HTTP y compara su respuesta contra
# el resultado de una query SQL directa a iDempiere.
#
# ── Tipos de validación ──────────────────────────────────────────────────
#   - valor_exacto: ground_truth es un escalar; buscar ese número en la
#     respuesta del bot con tolerancia configurable (default 0.5%).
#   - tabla_ordenada: ground_truth es una lista ordenada (top-N); parsear
#     la tabla markdown del bot y validar etiqueta + valor + posición.
#   - conteo_exacto: ground_truth es un entero (facturas, recibos, etc.);
#     match numérico exacto (sin tolerancia).
#
# ── REGLA DE ORO: correspondencia caso ↔ función del bot ─────────────────
# Cada SQL ground truth DEBE espejar la función real del bot que dispara
# esa pregunta. Si el bot usa `c_order`, el ground truth usa `c_order`.
# Si el bot deduplica nombres por tokens ordenados, el ground truth también.
# Escribir SQL por "intuición" destapa bugs que NO existen y oculta bugs
# que SÍ existen. Cada caso documenta abajo contra qué función se alinea.
#
# Solo incluir casos con datos cerrados (meses pasados, años anteriores).
# Evitar "este mes" / "hoy" / stock actual — esos van a smoke tests, no acá.

casos:
  # ─────────────────────────────────────────────────────────────────────
  # VENTAS
  # ─────────────────────────────────────────────────────────────────────

  # ┌─ CASO: ventas_total_neto_ves_feb_2026 ──────────────────────────────┐
  # │ Agente: ventas                                                      │
  # │ Función del bot: build_sales_summary (idempiere_queries.py:506)     │
  # │ Campo consultado: totales.venta_neta                                │
  # │   = total_neto (SUM ARI totallines) - monto_notas_credito (SUM ARC) │
  # │ Filtros que aplica el bot al recibir esta pregunta:                 │
  # │   - issotrx='Y', docstatus IN ('CO','CL'), isactive='Y'             │
  # │   - dt.docbasetype IN ('ARI','ARC') (mediante CASE en el CTE)       │
  # │   - c_currency_id=205 (VES por default cuando user dice "bolívares")│
  # │   - EXTRACT(YEAR)=2026, EXTRACT(MONTH)=2                            │
  # │   - NO filtra por org_name (user admin, org_ids=None)               │
  # │ Monedas en Santoni: VES=205, Euros=1000004, USD=9 IDs distintos     │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: ventas_total_neto_ves_feb_2026
    agente: ventas
    pregunta: "¿Cuánto vendimos en bolívares en febrero 2026?"
    ground_truth:
      extraer: scalar
      sql: |
        SELECT COALESCE(SUM(
                 CASE WHEN dt.docbasetype = 'ARI' THEN i.totallines
                      WHEN dt.docbasetype = 'ARC' THEN -i.totallines
                      ELSE 0 END), 0) AS venta_neta
        FROM adempiere.c_invoice i
        JOIN adempiere.c_doctype dt ON i.c_doctypetarget_id = dt.c_doctype_id
        WHERE i.issotrx = 'Y'
          AND i.docstatus IN ('CO', 'CL')
          AND i.isactive = 'Y'
          AND i.c_currency_id = 205
          AND EXTRACT(YEAR FROM i.dateinvoiced) = 2026
          AND EXTRACT(MONTH FROM i.dateinvoiced) = 2
    validar:
      tipo: valor_exacto
      tolerancia_pct: 0.01   # 1% por redondeos/timing

  # ┌─ CASO: top_10_vendedores_inproa_usd_feb_2026 ───────────────────────┐
  # │ Agente: ventas                                                      │
  # │ Función del bot: build_sales_summary (idempiere_queries.py:506)     │
  # │ Campo consultado: por_vendedor                                      │
  # │   -> pasa por _dedupe_salesrep_rows(sort_key="total_bruto")         │
  # │   -> _format_vendedores_table lo re-ordena por "total" (neta) DESC  │
  # │   -> toma top 10                                                    │
  # │                                                                     │
  # │ Filtros que aplica el bot al recibir esta pregunta:                 │
  # │   - org_name=['inproa santoni'] (de _ORG_MAP, filtro específico)    │
  # │   - currency_ids=[100,1000000,1000003,1000006,1000008,1000009,      │
  # │                   1000011,1000013,1000017] (USD, 9 IDs de Santoni)  │
  # │   - dateinvoiced en feb 2026                                        │
  # │                                                                     │
  # │ SOBRE DEDUP DE VENDEDORES (importante, leer):                       │
  # │ En iDempiere existen pares de ad_user con el mismo nombre en orden  │
  # │ permutado (ej: "ROJAS OBANDO RENEE" vs "RENEE ROJAS OBANDO") que el │
  # │ bot consolida con _dedupe_salesrep_rows por tokens ordenados        │
  # │ (idempiere_queries.py:455). Para el caso específico de USD feb 2026 │
  # │ en INPROA SANTONI, este SQL simple (sin CTE de dedup) PASA contra   │
  # │ la respuesta del bot → en este dataset los duplicados no caen en el │
  # │ top-10 o no existen, y el match por posición + valor + substring    │
  # │ de etiqueta (tolerante) funciona.                                   │
  # │                                                                     │
  # │ Si en el futuro otro caso (otro mes/otra org) se agrega al golden   │
  # │ suite y aparece con FAIL porque el bot muestra un nombre            │
  # │ consolidado que no coincide con ninguna fila del SQL, ahí habrá que │
  # │ replicar _dedupe_salesrep_rows en SQL. La replica usa 3 CTEs:       │
  # │   1. ventas_raw: calcula name_key = tokens(UPPER) ordenados         │
  # │      alfabéticamente (espeja _norm() del bot)                       │
  # │   2. agregado: SUM por name_key (fusiona los ad_user duplicados)    │
  # │   3. nombre_preferido: DISTINCT ON(name_key) tomando el vendedor    │
  # │      con mayor bruto (= el bot preserva el primer nombre tras       │
  # │      ordenar por bruto DESC)                                        │
  # │                                                                     │
  # │ Documentación adicional: DATOS_VERIFICACION_IDEMPIERE.md § 19.3     │
  # │ (pre-dedup histórico, datos del 26/Mar/2026)                        │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: top_10_vendedores_inproa_usd_feb_2026
    agente: ventas
    pregunta: "Top 10 mejores vendedores de INPROA SANTONI en dólares en febrero 2026"
    ground_truth:
      extraer: tabla
      sql: |
        SELECT au.name AS vendedor,
               COALESCE(SUM(
                 CASE WHEN dt.docbasetype = 'ARI' THEN i.totallines
                      WHEN dt.docbasetype = 'ARC' THEN -i.totallines
                      ELSE 0 END), 0) AS venta_neta
        FROM adempiere.c_invoice i
        JOIN adempiere.c_doctype dt ON i.c_doctypetarget_id = dt.c_doctype_id
        JOIN adempiere.ad_user au ON i.salesrep_id = au.ad_user_id
        JOIN adempiere.ad_org o ON i.ad_org_id = o.ad_org_id
        WHERE i.issotrx = 'Y'
          AND i.docstatus IN ('CO', 'CL')
          AND i.isactive = 'Y'
          AND o.name ILIKE '%INPROA SANTONI%'
          AND i.c_currency_id IN (100,1000000,1000003,1000006,1000008,1000009,1000011,1000013,1000017)
          AND EXTRACT(YEAR FROM i.dateinvoiced) = 2026
          AND EXTRACT(MONTH FROM i.dateinvoiced) = 2
        GROUP BY au.name
        ORDER BY venta_neta DESC
        LIMIT 10
    validar:
      tipo: tabla_ordenada
      columna_etiqueta: vendedor
      columna_valor: venta_neta
      tolerancia_pct: 0.01
      posicion_estricta: true

  # ┌─ CASO: facturas_venta_bolivares_feb_2026 ───────────────────────────┐
  # │ Agente: ventas                                                      │
  # │ Función del bot: build_sales_summary (idempiere_queries.py:506)     │
  # │ Campo consultado: totales.total_facturas                            │
  # │   = COUNT(*) de filas WHERE docbasetype='ARI' (ya excluye ARC)      │
  # │                                                                     │
  # │ Pregunta explícita: el bot por defecto interpreta "facturas de      │
  # │ venta" como "en bolívares" (contexto venezolano, fix C del 08/Abr). │
  # │ Para validar el conteo incluyendo USD hay que separar el caso.      │
  # │ Esta query refleja lo que el bot reporta: solo Bs (c_currency_id=205│
  # │ y solo ARI, sin notas de crédito).                                  │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: facturas_venta_bolivares_feb_2026
    agente: ventas
    pregunta: "¿Cuántas facturas de venta en bolívares emitimos en febrero 2026?"
    ground_truth:
      extraer: scalar
      sql: |
        SELECT COUNT(*) AS facturas
        FROM adempiere.c_invoice i
        JOIN adempiere.c_doctype dt ON i.c_doctypetarget_id = dt.c_doctype_id
        WHERE i.issotrx = 'Y'
          AND i.docstatus IN ('CO', 'CL')
          AND i.isactive = 'Y'
          AND dt.docbasetype = 'ARI'
          AND i.c_currency_id = 205
          AND EXTRACT(YEAR FROM i.dateinvoiced) = 2026
          AND EXTRACT(MONTH FROM i.dateinvoiced) = 2
    validar:
      tipo: conteo_exacto

  # ─────────────────────────────────────────────────────────────────────
  # RRHH
  # ─────────────────────────────────────────────────────────────────────

  # ┌─ CASO: empleados_activos_inproa_santoni ────────────────────────────┐
  # │ Agente: rrhh                                                        │
  # │ Función del bot: build_employee_summary (idempiere_queries.py:1784) │
  # │ Campo consultado: por_organizacion[INPROA SANTONI].activos          │
  # │   = COUNT(DISTINCT CASE WHEN e.isactive='Y' THEN c_bpartner_id END) │
  # │                                                                     │
  # │ El bot NO resuelve "INPROA SANTONI" a un filtro ILIKE — usa         │
  # │ org_ids del usuario (RBAC). Para admin user, org_ids=None → trae    │
  # │ TODAS las orgs, y el LLM extrae la fila de INPROA SANTONI del       │
  # │ breakdown por_organizacion.                                         │
  # │                                                                     │
  # │ Mi ground truth usa ILIKE directamente. El resultado es el mismo    │
  # │ porque ambas queries cuentan los mismos distinct c_bpartner_id      │
  # │ activos en las filas de hr_employee con ad_org_id de INPROA SANTONI.│
  # │                                                                     │
  # │ NOTA: el bot usa LEFT JOIN a ad_org pero filtra en Python al leer   │
  # │ por_organizacion. Mi INNER JOIN es semánticamente equivalente       │
  # │ porque no hay filas con ad_org_id huérfano que nos interesen.       │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: empleados_activos_inproa_santoni
    agente: rrhh
    pregunta: "¿Cuántos empleados activos hay en INPROA SANTONI?"
    ground_truth:
      extraer: scalar
      sql: |
        SELECT COUNT(DISTINCT e.c_bpartner_id) AS empleados
        FROM adempiere.hr_employee e
        JOIN adempiere.ad_org o ON e.ad_org_id = o.ad_org_id
        WHERE e.isactive = 'Y'
          AND o.name ILIKE '%INPROA SANTONI%'
    validar:
      tipo: conteo_exacto

  # ─────────────────────────────────────────────────────────────────────
  # COMPRAS PRODUCTORES
  # ─────────────────────────────────────────────────────────────────────

  # ┌─ CASO: compras_arroz_paddy_2026_total_kg ───────────────────────────┐
  # │ Agente: compras_productores                                         │
  # │ Función del bot: build_producer_purchases                           │
  # │                  (idempiere_queries.py:2582)                        │
  # │ Campo consultado: totales.total_peso_neto_kg = SUM(ol.qtyordered)   │
  # │                                                                     │
  # │ IMPORTANTE — c_order vs c_invoice:                                  │
  # │ En Santoni las compras a productores se registran como GUÍAS DE     │
  # │ RECEPCIÓN (c_order), no como facturas (c_invoice). La factura puede │
  # │ tardar días/semanas en emitirse o nunca registrarse, pero la guía   │
  # │ siempre existe. Por eso el volumen real de compras se mide sobre    │
  # │ c_order + qtyordered + dateordered, no sobre c_invoice.             │
  # │                                                                     │
  # │ Filtros que aplica el bot al recibir esta pregunta:                 │
  # │   - issotrx='N' (compras, no ventas)                                │
  # │   - docstatus IN ('CO','CL')                                        │
  # │   - isactive='Y'                                                    │
  # │   - LOWER(p.name) LIKE '%arroz paddy%' (_extract_producto devuelve  │
  # │     "arroz paddy" cuando el mensaje contiene "arroz")               │
  # │   - EXTRACT(YEAR FROM o.dateordered) = 2026                         │
  # │                                                                     │
  # │ Este caso se descubrió durante la primera iteración: el ground      │
  # │ truth original usaba c_invoice (por intuición) y daba 15M kg vs los │
  # │ 12.5M que reportaba el bot. Leer build_producer_purchases reveló    │
  # │ que el bot usa c_order, y al alinear ambos el match es exacto.      │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: compras_arroz_paddy_2026_total_kg
    agente: compras_productores
    pregunta: "¿Cuántos kilos de arroz paddy se compraron en 2026?"
    ground_truth:
      extraer: scalar
      sql: |
        SELECT COALESCE(SUM(ol.qtyordered), 0) AS total_kg
        FROM adempiere.c_order o
        JOIN adempiere.c_orderline ol ON o.c_order_id = ol.c_order_id
        JOIN adempiere.m_product p ON ol.m_product_id = p.m_product_id
        WHERE o.issotrx = 'N'
          AND o.docstatus IN ('CO', 'CL')
          AND o.isactive = 'Y'
          AND LOWER(p.name) LIKE '%arroz paddy%'
          AND EXTRACT(YEAR FROM o.dateordered) = 2026
    validar:
      tipo: valor_exacto
      tolerancia_pct: 0.005

  # ═════════════════════════════════════════════════════════════════════
  # TRANCHE 1 (09/Abr/2026) — expansión basada en logs reales
  #
  # Casos agregados después de analizar 1,273 preguntas reales de usuarios
  # (admin + 5 supervisores de Santoni: jalvarez, esalas, mfigueredo,
  # lsilva, cbracho). Distribución real de volumen:
  #   compras_insumos=311, rrhh=264, ventas=205, finanzas=105,
  #   produccion=78, contabilidad=74, compras_productores=68
  #
  # Objetivo de Tranche 1: ampliar cobertura de los 5 casos iniciales a
  # 10, metiendo el agente de mayor volumen (compras_insumos, todavía
  # sin cobertura) y probando periodos históricos (2025) + otra org
  # (InproMaiz). Todos usan los 3 tipos de validación soportados por el
  # runner (valor_exacto, conteo_exacto, tabla_ordenada).
  #
  # Pendientes para Tranche 2 (próxima sesión):
  #   - Casos de routing_bug (requiere extender runner con tipo
  #     `agente_esperado`): preguntas de mfigueredo sobre compras_productores
  #     que van a ventas; preguntas de esalas sobre cumpleaños que van a
  #     general; "saldo de cuentas por pagar" que va a compras_insumos.
  #   - Contabilidad: build_accounting_summary usa fact_acct, la
  #     validación de balance general es no trivial (múltiples valores en
  #     la respuesta). Se diferirá a Tranche 3.
  #   - Finanzas: cuentas por cobrar vencidas, saldos bancarios.
  #   - Produccion: órdenes de producción, existencia por producto.
  # ═════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────────
  # COMPRAS INSUMOS (agente con mayor volumen real, primer caso)
  # ─────────────────────────────────────────────────────────────────────

  # ┌─ CASO: compras_insumos_total_2025_ves ──────────────────────────────┐
  # │ Agente: compras_insumos                                             │
  # │ Función del bot: build_supply_purchases                             │
  # │                  (idempiere_queries.py:2830)                        │
  # │ Campo consultado: totales.total_monto = SUM(i.totallines)           │
  # │                                                                     │
  # │ El agente compras_insumos._detect_currency devuelve:                │
  # │   - USD_IDS si mensaje menciona "dolar/usd/dol"                     │
  # │   - VES_IDS si mensaje menciona "bolivar/bs/ves"                    │
  # │   - None si no menciona nada (default: mezcla todas las monedas)    │
  # │                                                                     │
  # │ Esta pregunta explícitamente dice "en bolívares" → filtro VES=205   │
  # │                                                                     │
  # │ Filtros que aplica el bot:                                          │
  # │   - issotrx='N' (compras)                                           │
  # │   - docstatus IN ('CO','CL'), isactive='Y'                          │
  # │   - c_currency_id=205 (VES explícito)                               │
  # │   - EXTRACT(YEAR FROM i.dateinvoiced)=2025                          │
  # │                                                                     │
  # │ Usa totallines (sin IVA), igual que ventas.                         │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: compras_insumos_total_2025_ves
    agente: compras_insumos
    pregunta: "¿Cuánto se compró en insumos en 2025 en bolívares?"
    ground_truth:
      extraer: scalar
      sql: |
        SELECT COALESCE(SUM(i.totallines), 0) AS total_monto
        FROM adempiere.c_invoice i
        WHERE i.issotrx = 'N'
          AND i.docstatus IN ('CO', 'CL')
          AND i.isactive = 'Y'
          AND i.c_currency_id = 205
          AND EXTRACT(YEAR FROM i.dateinvoiced) = 2025
    validar:
      tipo: valor_exacto
      tolerancia_pct: 0.01

  # ┌─ CASO: compras_insumos_facturas_count_2025_ves ─────────────────────┐
  # │ Agente: compras_insumos                                             │
  # │ Función del bot: build_supply_purchases                             │
  # │ Campo consultado: totales.total_ordenes                             │
  # │   = COUNT(DISTINCT i.c_invoice_id)                                  │
  # │                                                                     │
  # │ Nota: el bot llama al campo "total_ordenes" aunque consulta         │
  # │ c_invoice (facturas). Es un nombre engañoso en el código —          │
  # │ realmente son facturas de compra (no órdenes de compra, eso es      │
  # │ build_pending_purchase_orders usando c_order).                      │
  # │                                                                     │
  # │ Mismos filtros que el caso anterior.                                │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: compras_insumos_facturas_count_2025_ves
    agente: compras_insumos
    pregunta: "¿Cuántas facturas de compra en bolívares tenemos en 2025?"
    ground_truth:
      extraer: scalar
      sql: |
        SELECT COUNT(DISTINCT i.c_invoice_id) AS total_facturas
        FROM adempiere.c_invoice i
        WHERE i.issotrx = 'N'
          AND i.docstatus IN ('CO', 'CL')
          AND i.isactive = 'Y'
          AND i.c_currency_id = 205
          AND EXTRACT(YEAR FROM i.dateinvoiced) = 2025
    validar:
      tipo: conteo_exacto

  # ─────────────────────────────────────────────────────────────────────
  # RRHH — segunda organización para validar consistencia del filtro
  # ─────────────────────────────────────────────────────────────────────

  # ┌─ CASO: empleados_activos_inpromaiz ─────────────────────────────────┐
  # │ Agente: rrhh                                                        │
  # │ Función del bot: build_employee_summary                             │
  # │ Campo consultado: por_organizacion[InproMaiz].activos               │
  # │                                                                     │
  # │ Espeja `empleados_activos_inproa_santoni` pero para InproMaiz       │
  # │ (la otra planta principal, dedicada a maíz). Verifica que el       │
  # │ filtro por nombre de org funciona consistentemente para ≥2 orgs.   │
  # │                                                                     │
  # │ Según la doc de DATOS_VERIFICACION_IDEMPIERE.md, InproMaiz tiene    │
  # │ ~206 empleados totales. El valor exacto puede variar por el        │
  # │ estado actual de isactive.                                          │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: empleados_activos_inpromaiz
    agente: rrhh
    pregunta: "¿Cuántos empleados activos hay en InproMaiz?"
    ground_truth:
      extraer: scalar
      sql: |
        SELECT COUNT(DISTINCT e.c_bpartner_id) AS empleados
        FROM adempiere.hr_employee e
        JOIN adempiere.ad_org o ON e.ad_org_id = o.ad_org_id
        WHERE e.isactive = 'Y'
          AND o.name ILIKE '%InproMaiz%'
    validar:
      tipo: conteo_exacto

  # ─────────────────────────────────────────────────────────────────────
  # VENTAS — período histórico diferente (enero 2026)
  # ─────────────────────────────────────────────────────────────────────

  # ┌─ CASO: ventas_total_neto_ves_enero_2026 ────────────────────────────┐
  # │ Agente: ventas                                                      │
  # │ Función del bot: build_sales_summary.totales.venta_neta             │
  # │                                                                     │
  # │ Hallazgo del análisis de logs: la pregunta                          │
  # │   "cuanto se vendio en enero 2026"                                  │
  # │ apareció 3 veces con confidence 0.64 (= posible problema). Después  │
  # │ de los fixes del 08/Abr (default a VES + dedup + pre-format), la    │
  # │ pregunta debería rutear bien y dar el neto correcto.                │
  # │                                                                     │
  # │ Este caso valida que no hay regresiones en períodos distintos a     │
  # │ feb 2026 (el único que teníamos en el suite).                       │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: ventas_total_neto_ves_enero_2026
    agente: ventas
    pregunta: "¿Cuánto vendimos en bolívares en enero 2026?"
    ground_truth:
      extraer: scalar
      sql: |
        SELECT COALESCE(SUM(
                 CASE WHEN dt.docbasetype = 'ARI' THEN i.totallines
                      WHEN dt.docbasetype = 'ARC' THEN -i.totallines
                      ELSE 0 END), 0) AS venta_neta
        FROM adempiere.c_invoice i
        JOIN adempiere.c_doctype dt ON i.c_doctypetarget_id = dt.c_doctype_id
        WHERE i.issotrx = 'Y'
          AND i.docstatus IN ('CO', 'CL')
          AND i.isactive = 'Y'
          AND i.c_currency_id = 205
          AND EXTRACT(YEAR FROM i.dateinvoiced) = 2026
          AND EXTRACT(MONTH FROM i.dateinvoiced) = 1
    validar:
      tipo: valor_exacto
      tolerancia_pct: 0.01

  # ─────────────────────────────────────────────────────────────────────
  # COMPRAS PRODUCTORES — período histórico (2025) para validar consistencia
  # ─────────────────────────────────────────────────────────────────────

  # ┌─ CASO: compras_arroz_paddy_2025_total_kg ───────────────────────────┐
  # │ Agente: compras_productores                                         │
  # │ Función del bot: build_producer_purchases                           │
  # │                                                                     │
  # │ Variante histórica del caso 2026. Valida que el filtro por año      │
  # │ funciona consistentemente para períodos pasados y que no hay        │
  # │ corte por HISTORICAL_DATA_CUTOFF que afecte el resultado.           │
  # │                                                                     │
  # │ Mismo SQL que compras_arroz_paddy_2026_total_kg pero con año=2025.  │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: compras_arroz_paddy_2025_total_kg
    agente: compras_productores
    pregunta: "¿Cuántos kilos de arroz paddy se compraron en 2025?"
    ground_truth:
      extraer: scalar
      sql: |
        SELECT COALESCE(SUM(ol.qtyordered), 0) AS total_kg
        FROM adempiere.c_order o
        JOIN adempiere.c_orderline ol ON o.c_order_id = ol.c_order_id
        JOIN adempiere.m_product p ON ol.m_product_id = p.m_product_id
        WHERE o.issotrx = 'N'
          AND o.docstatus IN ('CO', 'CL')
          AND o.isactive = 'Y'
          AND LOWER(p.name) LIKE '%arroz paddy%'
          AND EXTRACT(YEAR FROM o.dateordered) = 2025
    validar:
      tipo: valor_exacto
      tolerancia_pct: 0.005
