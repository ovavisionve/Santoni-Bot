  # ═════════════════════════════════════════════════════════════════════
  # TRANCHE 3 (09/Abr/2026) — expansión con casos reales de supervisores
  #
  # 10 casos adicionales basados en preguntas reales del análisis de logs
  # (jalvarez, esalas, mfigueredo, lsilva, cbracho). Complementa Tranche 1
  # (datos) y Tranche 2 (routing) con:
  #
  #   - 2 casos de datos que validan campos específicos de la respuesta
  #     (notas de crédito count, empleados activos en una 3ra org)
  #   - 8 casos de routing que cubren preguntas comunes de supervisores
  #     que no estaban en el suite.
  #
  # Todos los casos provienen de preguntas literales de los logs.
  # ═════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────────
  # DATOS (2 casos nuevos)
  # ─────────────────────────────────────────────────────────────────────

  # CASO: ventas_nc_monto_feb_2026_ves
  # Valida que el monto de notas de crédito en la respuesta de ventas generales
  # coincida con el ground truth de iDempiere.
  #
  # NOTA: La pregunta debe activar la rama GENERAL (build_sales_summary), no la
  # rama de PRODUCTO. "notas de crédito" como frase activa la sección de NC por
  # producto que calcula montos diferentes (por línea, no por factura). Al pedir
  # "desglose de ventas" con "incluyendo notas de crédito", el bot devuelve la
  # sección general que incluye totales.monto_notas_credito como campo separado.
  - id: ventas_nc_monto_feb_2026_ves
    agente: ventas
    pregunta: "¿Cuánto vendimos en bolívares en febrero 2026? Incluye el desglose de notas de crédito"
    ground_truth:
      extraer: scalar
      sql: |
        SELECT COALESCE(SUM(i.totallines), 0) AS monto_nc
        FROM adempiere.c_invoice i
        JOIN adempiere.c_doctype dt ON i.c_doctypetarget_id = dt.c_doctype_id
        WHERE i.issotrx = 'Y'
          AND i.docstatus IN ('CO', 'CL')
          AND i.isactive = 'Y'
          AND dt.docbasetype = 'ARC'
          AND i.c_currency_id = 205
          AND i.dateinvoiced >= '2026-02-01'
          AND i.dateinvoiced < '2026-03-01'
    validar:
      tipo: valor_exacto
      tolerancia_pct: 0.01

  # CASO: rrhh_empleados_activos_agroinproa
  # Tercera organización cubierta en rrhh (INPROA SANTONI y InproMaiz ya
  # están). Valida que el filtro por nombre funciona para todas las orgs
  # del grupo. AGROINPROA es la más pequeña (~38 empleados según docs).
  # Función del bot: build_employee_summary.por_organizacion[AGROINPROA].activos
  - id: rrhh_empleados_activos_agroinproa
    agente: rrhh
    pregunta: "¿Cuántos empleados activos hay en AGROINPROA?"
    ground_truth:
      extraer: scalar
      sql: |
        SELECT COUNT(DISTINCT e.c_bpartner_id) AS empleados
        FROM adempiere.hr_employee e
        JOIN adempiere.ad_org o ON e.ad_org_id = o.ad_org_id
        WHERE e.isactive = 'Y'
          AND o.name ILIKE '%AGROINPROA%'
    validar:
      tipo: conteo_exacto

